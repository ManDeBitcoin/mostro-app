server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable ETag headers for client revalidation
    etag on;

    # Root and HTML/bootstrap files: NEVER cache in browser or proxy.
    # Must revalidate every single time so deploys appear immediately.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    location ~* ^/(index\.html|version\.json|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # Dart JS and WASM: Always revalidate with ETag.
    # If unchanged, server sends 304 (fast, 0 bytes transfer).
    # If new commit deployed, downloads new version immediately.
    location ~* \.(js|wasm)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # Static assets (fonts, images, media): revalidated on every load, like
    # the scripts above. Their names are the same from build to build and
    # their contents are not: the icon font holds only the icons that build
    # draws. Kept for a day, a browser that had the app open before a deploy
    # drew the new screens with the old font, and every icon the deploy
    # added came out blank (the price control's minus sign, October 2026).
    # Unchanged, a file costs a 304 and no transfer.
    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
}
